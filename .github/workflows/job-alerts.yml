name: job-alerts

# Runs 24/7. Each run checks every few minutes for ~50 minutes, then starts
# the next run itself (GitHub's scheduler alone is too unreliable). The
# hourly schedule is only a backup in case the chain ever breaks.
# To stop the bot: Actions → job-alerts → "..." → Disable workflow.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:  # restart with new code/settings as soon as they're pushed
    branches: [main]
    paths: ["*.py", "requirements.txt", ".github/workflows/**"]

concurrency:
  group: job-alerts
  cancel-in-progress: false

permissions:
  contents: write  # to save state/seen.json back to the repo
  actions: write   # to start the next run

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_alerts.py --loop 50

      - name: Save seen jobs
        if: ${{ !cancelled() }}
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update seen jobs"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run job-alerts.yml --ref main
